# Docker Compose del monorepo (responsable: Kevin).
# PLACEHOLDER: los Dockerfile existen pero las apps aún no tienen código,
# así que `docker compose up` no funcionará hasta el Sprint 1.
# Supabase local se levanta aparte con la CLI: `supabase start` (ver backend/database/README.md).

services:
  api:
    build: ./backend/api
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - face-service

  gtfs-worker:
    build: ./backend/gtfs-worker
    env_file: .env
    volumes:
      - gtfs-data:/app/data

  face-service:
    build: ./backend/face-service
    env_file: .env
    ports:
      - "8001:8001"

  # La app Expo se ejecuta fuera de Docker (pnpm dev:mobile) para usar Expo Go en el móvil.

volumes:
  gtfs-data:
