# Actualizaciones de versión desactivadas: Dependabot no abre PRs de dependencias.
# `open-pull-requests-limit: 0` desactiva las PRs de versión de cada ecosistema,
# pero mantiene el seguimiento. Las alertas y PRs de SEGURIDAD se configuran
# aparte en Settings > Code security y no se desactivan desde este fichero.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
